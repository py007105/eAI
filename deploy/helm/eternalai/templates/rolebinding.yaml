{{- range $namespace := .Values.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eternalai
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: eternalai
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: eternalai
  apiGroup: rbac.authorization.k8s.io
{{- end }}
