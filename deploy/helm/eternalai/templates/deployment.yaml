{{- if and (ne .Values.mode "watch") (not .Values.approvalToken.existingSecret) -}}
{{- fail "approvalToken.existingSecret is required outside watch mode" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eternalai
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eternalai
  template:
    metadata:
      labels:
        app: eternalai
    spec:
      serviceAccountName: eternalai
      containers:
        - name: brain
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: RUNTIME
              value: kubernetes
            - name: METRICS_SOURCE
              value: kubernetes
            - name: KUBERNETES_NAMESPACE
              value: {{ first .Values.namespaces | quote }}
            - name: ETERNALAI_MODE
              value: {{ .Values.mode | quote }}
            - name: ETERNALAI_POLICY_FILE
              value: /etc/eternalai/policy.yaml
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            - name: KUBERNETES_METRICS
              value: {{ .Values.metricsProfile | quote }}
            {{- if .Values.frontendUrl }}
            - name: KUBERNETES_FRONTEND_URL
              value: {{ .Values.frontendUrl | quote }}
            {{- end }}
            {{- if .Values.prometheus.existingSecret }}
            - name: PROMETHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.prometheus.existingSecret }}
                  key: token
            {{- end }}
            {{- if .Values.approvalToken.existingSecret }}
            - name: ETERNALAI_APPROVAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.approvalToken.existingSecret }}
                  key: token
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: rulebook
              mountPath: /etc/eternalai
              readOnly: true
      volumes:
        - name: rulebook
          configMap:
            name: eternalai-rulebook
