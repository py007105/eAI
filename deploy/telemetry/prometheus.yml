global:
  scrape_interval: 2s
  evaluation_interval: 5s
scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["web:8000", "orders:8000", "payments:8000", "inventory:8000"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance_name
  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:9100"]
