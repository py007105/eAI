name: eai

x-app: &app
  restart: "no"            # recovery is EternalAI's job, not Docker's
  mem_limit: 256m
  networks: [eai]
  environment: &appenv
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}      # v2: the telemetry condition is chosen by the pre-registered Stage 0 rule (Amendment 4)
    CHAOS_TOKEN: ${CHAOS_TOKEN:?set CHAOS_TOKEN to a real secret in .env}   # required: the services also refuse the old default 'evaluator-only'

services:
  inventory:
    <<: *app
    build: {context: ./app, args: {SERVICE: inventory, VERSION: v1, RELEASE_SEQ: "1"}}
    image: eai/inventory:v1
    volumes: [inventory-data:/data]
    labels: {eai.managed: "true", eai.role: app}
  payments:
    <<: *app
    build: {context: ./app, args: {SERVICE: payments, VERSION: v1, RELEASE_SEQ: "1"}}
    image: eai/payments:v1
    volumes: [payments-data:/data]
    labels: {eai.managed: "true", eai.role: app}
  orders:
    <<: *app
    build: {context: ./app, args: {SERVICE: orders, VERSION: v1, RELEASE_SEQ: "1"}}
    image: eai/orders:v1
    volumes: [orders-data:/data]
    depends_on: [inventory, payments]
    labels: {eai.managed: "true", eai.role: app}
  web:
    <<: *app
    build: {context: ./app, args: {SERVICE: web, VERSION: v1, RELEASE_SEQ: "1"}}
    image: eai/web:v1
    ports: ["127.0.0.1:8080:8000"]
    depends_on: [orders, inventory]
    labels: {eai.managed: "true", eai.role: app}

  # Release images used by the evaluator for deploy scenarios. Built with
  # `docker compose --profile releases build`; never started by `up`.
  web-v2: {build: {context: ./app, args: {SERVICE: web, VERSION: v2-good, RELEASE_SEQ: "2"}}, image: "eai/web:v2-good", profiles: [releases]}
  orders-v2: {build: {context: ./app, args: {SERVICE: orders, VERSION: v2-good, RELEASE_SEQ: "2"}}, image: "eai/orders:v2-good", profiles: [releases]}
  payments-v2: {build: {context: ./app, args: {SERVICE: payments, VERSION: v2-good, RELEASE_SEQ: "2"}}, image: "eai/payments:v2-good", profiles: [releases]}
  inventory-v2: {build: {context: ./app, args: {SERVICE: inventory, VERSION: v2-good, RELEASE_SEQ: "2"}}, image: "eai/inventory:v2-good", profiles: [releases]}
  web-v3: {build: {context: ./app, args: {SERVICE: web, VERSION: v3-bad, RELEASE: bad, RELEASE_SEQ: "3"}}, image: "eai/web:v3-bad", profiles: [releases]}
  orders-v3: {build: {context: ./app, args: {SERVICE: orders, VERSION: v3-bad, RELEASE: bad, RELEASE_SEQ: "3"}}, image: "eai/orders:v3-bad", profiles: [releases]}
  payments-v3: {build: {context: ./app, args: {SERVICE: payments, VERSION: v3-bad, RELEASE: bad, RELEASE_SEQ: "3"}}, image: "eai/payments:v3-bad", profiles: [releases]}
  inventory-v3: {build: {context: ./app, args: {SERVICE: inventory, VERSION: v3-bad, RELEASE: bad, RELEASE_SEQ: "3"}}, image: "eai/inventory:v3-bad", profiles: [releases]}

  # Independent fault injector and scorer. Only this service mounts the truth volume;
  # EternalAI cannot read what was injected until scoring.
  evaluator:
    build: ./evaluator
    image: eai/evaluator:v1
    mem_limit: 256m
    networks: [eai]
    ports: ["127.0.0.1:8200:8200"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "truth:/truth"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      EAI_URL: ${EAI_URL:-http://eternalai:8000}   # set EAI_URL=http://host.docker.internal:8000 to score a host-run backend
      CHAOS_TOKEN: ${CHAOS_TOKEN:?set CHAOS_TOKEN to a real secret in .env}
      ETERNALAI_APPROVAL_TOKEN: ${ETERNALAI_APPROVAL_TOKEN:-change-me}   # POST /runs needs it (same token as the brain)
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [web]

  # The brain. It mounts the Docker socket (root-equivalent on the host; see docs/EVALUATION.md, Security)
  # but NOT the truth volume. Approve/reject/mode endpoints are refused until a real token is set in .env.
  eternalai:
    build: {context: ., dockerfile: eternalai/Dockerfile}
    image: eai/eternalai:v2
    networks: [eai]
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 512m
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "eternalai-runtime:/srv/runtime"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      WEB_URL: http://web:8000
      EVALUATOR_URL: http://evaluator:8200
      ETERNALAI_BRAIN: ${ETERNALAI_BRAIN:-eternalai}   # eternalai | threshold_restart | prototype_rules (benchmark baselines)
      ETERNALAI_MODE: ${ETERNALAI_MODE:-}             # empty: the rulebook's mode
      ETERNALAI_POLICY_FILE: ${ETERNALAI_POLICY_FILE:-}  # empty: eternalai/rulebooks/default.yaml (the plan's values)
      ETERNALAI_APPROVAL_TOKEN: ${ETERNALAI_APPROVAL_TOKEN:-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on: [prometheus, web]

  dashboard:
    build: {context: ., dockerfile: dashboard/Dockerfile}
    image: eai/dashboard:v1
    networks: [eai]
    ports: ["127.0.0.1:8050:8050"]
    mem_limit: 256m
    environment:
      BACKEND_URL: http://eternalai:8000
    depends_on: [eternalai]

  loadgen:
    build: ./loadgen
    image: eai/loadgen:v1
    mem_limit: 128m
    networks: [eai]
    environment:
      TARGET_URL: http://web:8000
      BASE_RPS: ${BASE_RPS:-6}
      SURGE_EVERY_S: ${SURGE_EVERY_S:-0}
    depends_on: [web]

  prometheus:
    image: prom/prometheus:v2.55.1
    mem_limit: 512m
    networks: [eai]
    ports: ["127.0.0.1:9090:9090"]
    volumes: [./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2h"]

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    mem_limit: 512m
    networks: [eai]
    ports: ["127.0.0.1:16686:16686"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: ${JAEGER_MAX_TRACES:-1000}   # v2: cap the in-memory store; v1 ran it unbounded and it was OOM-killed at its 512 MB limit

networks:
  eai: {}
volumes:
  inventory-data: {}
  payments-data: {}
  orders-data: {}
  truth: {}
  eternalai-runtime: {}
