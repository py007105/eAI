# EternalAI rulebook: the plan's values (docs/ETERNALAI_PLAN.md §6.3, §6.4, §13.2, §14, §15.5).
# Loaded once at start and validated (engine/rulebook.py); an invalid file stops the brain.
# Select another file with ETERNALAI_POLICY_FILE (or POLICY_FILE). ETERNALAI_MODE, if set, overrides `mode`.

mode: ask-first                  # watch | ask | autopilot (also watch-only / ask-first)
auto_allowed_risks: [low]        # autopilot runs only these without approval; "high" is refused by the loader
protected_services: [payments]   # always need approval, in every mode (plan §14)
database_services: []            # any action on these is high risk (plan §14). The demo shop has no separate database service.
max_actions_per_hour: 10         # across all services (plan §15.5)
cooldown_s: 40                   # per service (plan §6.3)
max_unverified_actions_per_service: 2   # then the circuit breaker opens until a verified recovery (plan §6.3 "max 2 attempts")
namespaces: [shop]               # Kubernetes only: actions outside these namespaces are refused

runbook_risk:                    # base risk per runbook (plan §6.4, §13.2)
  restart_service: low
  clear_temp_path: low
  recreate_container: low        # stateless web: a fresh container from the same image
  rollback_release: high         # always needs approval (plan §6.4 "high (always asks)", §14)

service_risk:                    # sets the risk of a runbook on one service
  orders:    {recreate_container: high}   # services that own a data volume
  payments:  {recreate_container: high}
  inventory: {recreate_container: high}

fault_overrides:                 # by diagnosed fault (plan §6.4, §15.5)
  error_spike:   {risk: medium}  # plan §6.4: restart for error_spike / latency_spike / cpu_runaway is medium
  latency_spike: {risk: medium}
  cpu_runaway:   {risk: medium, act_only_if_user_impact: true}
  db_slowdown:   {action: escalate}
